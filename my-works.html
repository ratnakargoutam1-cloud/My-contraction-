<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Works - My Construction</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

.header{
  background:#111827;
  color:white;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header h2{
  margin:0;
  font-size:20px;
}

.back{
  color:white;
  text-decoration:none;
}

.container{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.top h3{
  margin:0;
}

.add{
  border:0;
  background:#16a34a;
  color:white;
  padding:10px 14px;
  border-radius:10px;
  font-weight:bold;
}

.card{
  background:white;
  padding:18px;
  border-radius:16px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

.info{
  margin:7px 0;
  color:#555;
  font-size:14px;
}

.status{
  display:inline-block;
  margin-top:8px;
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.open{
  background:#dcfce7;
  color:#166534;
}

.closed{
  background:#fee2e2;
  color:#991b1b;
}

.message{
  text-align:center;
  padding:30px 10px;
}

.error{
  color:#dc2626;
  background:#fee2e2;
  border-radius:12px;
  padding:15px;
}

button.action{
  width:100%;
  margin-top:12px;
  padding:11px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
  <h2>🏗️ My Construction</h2>
  <a class="back" href="dashboard.html">← वापस</a>
</div>

<div class="container">

  <div class="top">
    <h3>📋 मेरे Works</h3>

    <button class="add" onclick="addWork()">
      ➕ Add Work
    </button>
  </div>

  <div id="works">
    <div class="message">
      ⏳ Works load हो रहे हैं...
    </div>
  </div>

</div>


<script>

const SUPABASE_URL =
"https://izxvsvyvvtbaxtxgcfav.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XZmYflVzFZOujSbJFXlEuw_ml-zIviI";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function loadWorks(){

  const box =
  document.getElementById("works");

  try{

    const sessionResult =
    await supabaseClient.auth.getSession();

    const session =
    sessionResult.data.session;

    if(!session){

      box.innerHTML = `
        <div class="message error">
          ❌ Login नहीं है।<br><br>
          पहले Login करें।
        </div>
      `;

      return;
    }


    const userId =
    session.user.id;


    console.log("Current User ID:",userId);


    const result =
    await supabaseClient
      .from("Works")
      .select("*")
      .eq("thekedar_id",userId)
      .order("created_at",{ascending:false});


    console.log("Works result:",result);


    if(result.error){

      box.innerHTML = `
        <div class="message error">
          ❌ Works load नहीं हुए।<br><br>
          ${result.error.message}
        </div>
      `;

      return;
    }


    const data =
    result.data;


    if(!data || data.length === 0){

      box.innerHTML = `
        <div class="message">
          📭 अभी कोई Work नहीं मिला।
          <br><br>
          <small>
            Login User ID: ${userId}
          </small>
        </div>
      `;

      return;
    }


    box.innerHTML = "";


    data.forEach(function(work){

      const status =
      String(work.Status || "open").toLowerCase();

      const statusClass =
      status === "open"
      ? "open"
      : "closed";


      const card =
      document.createElement("div");

      card.className="card";


      card.innerHTML = `

        <div class="title">
          🏗️ ${safe(work.Title)}
        </div>

        <div class="info">
          📝 ${safe(work.Description)}
        </div>

        <div class="info">
          🛠️ Skill:
          ${safe(work.Skill_required)}
        </div>

        <div class="info">
          📍 Location:
          ${safe(work.Location)}
        </div>

        <div class="info">
          💰 Daily Wage:
          ₹${work.Daily_wage ?? "-"}
        </div>

        <div class="info">
          👷 Workers Needed:
          ${work.Workers_needed ?? "-"}
        </div>

        <div class="info">
          📅 Start Date:
          ${work.Start_date ?? "-"}
        </div>

        <div class="status ${statusClass}">
          ${status === "open" ? "🟢 OPEN" : "🔴 " + status.toUpperCase()}
        </div>

        ${
          status === "open"
          ?
          `<button
             class="action"
             onclick="closeWork('${work.id}')">
             🔴 Work Close करें
           </button>`
          :
          `<button
             class="action"
             onclick="openWork('${work.id}')">
             🟢 Work Open करें
           </button>`
        }

      `;


      box.appendChild(card);

    });

  }
  catch(error){

    console.error(error);

    box.innerHTML = `
      <div class="message error">
        ❌ Error आया।<br><br>
        ${error.message}
      </div>
    `;

  }

}


async function closeWork(id){

  const yes =
  confirm("क्या आप यह Work Close करना चाहते हैं?");

  if(!yes) return;


  const result =
  await supabaseClient
    .from("Works")
    .update({
      Status:"closed"
    })
    .eq("id",id);


  if(result.error){

    alert(
      "❌ Error: " +
      result.error.message
    );

    return;
  }


  alert("✅ Work Close हो गया।");

  loadWorks();

}


async function openWork(id){

  const result =
  await supabaseClient
    .from("Works")
    .update({
      Status:"open"
    })
    .eq("id",id);


  if(result.error){

    alert(
      "❌ Error: " +
      result.error.message
    );

    return;
  }


  alert("✅ Work फिर से Open हो गया।");

  loadWorks();

}


function addWork(){

  window.location.href =
  "add-work.html";

}


function safe(value){

  if(value === null ||
     value === undefined ||
     value === ""){

    return "-";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


loadWorks();

</script>

</body>
</html>
